# Production API gateway on EC2: CloudFront forwards /api/* here; the SPA itself is on S3.
# The /api location blocks mirror frontend/nginx.conf, which still serves local `docker compose up`.
server {
    listen 8080;
    server_name _;

    # default nginx body size is 1MB but supplier-service's MAX_FILE_SIZE for image uploads is 5MB
    client_max_body_size 5m;

    location = /healthz {
        return 200 "ok\n";
    }

    location /api/auth {
        proxy_pass http://user-service:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/users {
        proxy_pass http://user-service:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/suppliers {
        proxy_pass http://supplier-service:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/orders {
        proxy_pass http://order-service:3002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/credits {
        proxy_pass http://credit-service:3003;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Only the five prefixes above exist; anything else is a 404.
    location /api/ {
        return 404;
    }

    location / {
        return 404;
    }
}
