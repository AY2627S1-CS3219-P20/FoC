services:
  # reference for postgres: https://www.prisma.io/docs/guides/deployment/docker
  supplier-postgres:
    image: postgres:17
    restart: always
    environment:
      - POSTGRES_DB=suppliers
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - supplier_postgres_data:/var/lib/postgresql/data

  supplier-service:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@supplier-postgres:5432/suppliers?sslmode=disable
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    ports:
      - "3001:3001"
    volumes:
      - ./keys/public.pem:/app/keys/public.pem:ro # read-only (ro)
      # seed.ts reads ../data/csv relative to /app, i.e. /data/csv
      - ../data/csv:/data/csv:ro # read-only (ro)
      - supplier_uploads:/app/uploads
    depends_on:
      supplier-postgres:
        condition: service_healthy

volumes:
  supplier_postgres_data:
  supplier_uploads: