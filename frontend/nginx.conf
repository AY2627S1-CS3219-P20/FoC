server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let React Router handle direct visits and page refreshes on client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing assets should return 404 instead of the application HTML.
    location /assets/ {
        try_files $uri =404;
    }
}
